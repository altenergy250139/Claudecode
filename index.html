<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>グローバルAIマーケティング ニュースコレクター</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AI Marketing">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%2307070c' width='100' height='100' rx='20'/><text y='70' x='50' text-anchor='middle' font-size='60'>🌐</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;600;700;900&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #07070c; --card: rgba(255,255,255,0.025); --card-hover: rgba(255,255,255,0.055);
    --border: rgba(255,255,255,0.06); --text: #fff; --text-dim: rgba(255,255,255,0.45);
    --accent: #FF6B35; --accent2: #4ECDC4; --red: #FF4058;
  }
  body {
    background: var(--bg); color: var(--text); min-height: 100vh;
    font-family: 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 3px; }
  .header {
    position: relative; text-align: center; padding: 54px 24px 44px;
    border-bottom: 1px solid var(--border); overflow: hidden;
  }
  .header::before {
    content: ''; position: absolute; inset: 0; opacity: .06;
    background: radial-gradient(ellipse at 25% -10%, var(--accent) 0%, transparent 60%),
                radial-gradient(ellipse at 75% 110%, var(--accent2) 0%, transparent 60%);
  }
  .header .tag {
    font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: .3em;
    text-transform: uppercase; color: var(--accent); font-weight: 700; margin-bottom: 16px;
  }
  .header h1 {
    font-size: clamp(25px, 5vw, 40px); font-weight: 900; line-height: 1.35;
    letter-spacing: -.02em; margin-bottom: 12px;
    background: linear-gradient(135deg, #fff 0%, var(--accent) 50%, var(--accent2) 100%);
    background-size: 200% 200%; animation: grad 6s ease infinite;
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .header p { color: var(--text-dim); font-size: 14px; line-height: 1.7; max-width: 480px; margin: 0 auto 28px; position: relative; }
  .btn-main {
    background: linear-gradient(135deg, var(--accent), var(--red)); color: #fff;
    border: none; border-radius: 50px; padding: 16px 46px; font-size: 16px;
    font-weight: 700; cursor: pointer; font-family: inherit; letter-spacing: .02em;
    box-shadow: 0 4px 28px rgba(255,107,53,.3); transition: all .3s ease;
    animation: float 3s ease-in-out infinite; position: relative;
  }
  .btn-main:hover { transform: scale(1.05); box-shadow: 0 8px 36px rgba(255,107,53,.5); }
  .btn-main:disabled { opacity: .5; cursor: not-allowed; animation: none; }
  .region-tags { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 22px; position: relative; z-index: 1; }
  .region-tag {
    padding: 5px 14px; border-radius: 20px; font-size: 12px;
    border: 1px solid transparent;
  }
  .loader-wrap { display: flex; flex-direction: column; align-items: center; padding: 60px 20px; gap: 24px; }
  .orb {
    width: 120px; height: 120px; border-radius: 50%; position: relative;
    display: flex; align-items: center; justify-content: center;
    animation: pulse 2s ease-in-out infinite;
  }
  .orb-inner {
    width: 96px; height: 96px; border-radius: 50%; background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 700; color: var(--accent);
  }
  .loader-label { font-size: 16px; font-weight: 600; }
  .loader-sub { color: var(--text-dim); font-size: 13px; }
  .summary-box {
    background: linear-gradient(135deg, rgba(255,107,53,.07), rgba(78,205,196,.07));
    border-radius: 20px; padding: 28px 32px; margin-bottom: 32px;
    border: 1px solid var(--border); animation: fadeUp .5s ease both;
  }
  .summary-box .label {
    font-family: 'Space Mono', monospace; font-size: 12px; font-weight: 700;
    color: var(--accent); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 14px;
  }
  .summary-box .body { color: rgba(255,255,255,.72); font-size: 14px; line-height: 1.9; }
  .summary-box .stat-row { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 14px; }
  .summary-box .stat {
    padding: 6px 14px; border-radius: 12px; font-size: 13px; font-weight: 600;
  }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; animation: fadeUp .4s ease both; }
  .filter-btn {
    background: var(--card); border: 1px solid var(--border); color: var(--text-dim);
    border-radius: 20px; padding: 6px 16px; font-size: 13px; cursor: pointer;
    font-family: inherit; transition: all .2s;
  }
  .filter-btn.active { background: rgba(255,255,255,.1); color: #fff; border-color: rgba(255,255,255,.2); }
  .card {
    background: var(--card); border-radius: 16px; border: 1px solid var(--border);
    padding: 24px 28px; transition: all .3s ease; position: relative;
    overflow: hidden; margin-bottom: 14px;
  }
  .card:hover { background: var(--card-hover); transform: translateY(-2px); }
  .card .stripe { position: absolute; top: 0; left: 0; width: 4px; height: 100%; border-radius: 4px 0 0 4px; }
  .card .meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .card .meta .badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
  .card .meta .cat {
    background: rgba(255,255,255,.05); color: rgba(255,255,255,.45);
    padding: 4px 10px; border-radius: 20px; font-size: 11px;
  }
  .card .meta .date { color: var(--text-dim); font-size: 11px; margin-left: auto; }
  .card h3 { font-size: 17px; font-weight: 700; line-height: 1.5; letter-spacing: .01em; margin-bottom: 10px; }
  .card h3 a { color: inherit; text-decoration: none; }
  .card h3 a:hover { text-decoration: underline; }
  .card .desc {
    color: rgba(255,255,255,.52); font-size: 14px; line-height: 1.7;
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card .desc.open { display: block; -webkit-line-clamp: unset; overflow: visible; }
  .card .toggle {
    text-align: right; margin-top: 8px; color: rgba(255,255,255,.25); font-size: 12px;
    cursor: pointer;
  }
  .card .toggle:hover { color: rgba(255,255,255,.5); }
  .card .source-link {
    display: inline-block; margin-top: 14px; color: var(--accent); font-size: 13px;
    text-decoration: none; font-weight: 600;
  }
  .card .source-link:hover { text-decoration: underline; }
  .empty { text-align: center; padding: 60px 20px; color: rgba(255,255,255,.18); }
  .empty .icon { font-size: 48px; margin-bottom: 16px; opacity: .4; }
  .error-box {
    text-align: center; padding: 40px; border-radius: 16px;
    background: rgba(255,64,88,.04); border: 1px solid rgba(255,64,88,.1); color: var(--red);
  }
  .container { max-width: 820px; margin: 0 auto; padding: 30px 20px 60px; }
  @keyframes grad { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  @keyframes pulse { 0%,100%{box-shadow:0 0 20px rgba(255,107,53,.25)} 50%{box-shadow:0 0 44px rgba(255,107,53,.55)} }
  @keyframes fadeUp { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:translateY(0)} }
</style>
</head>
<body>
<div class="header">
  <div class="tag">AI Marketing Intelligence</div>
  <h1>グローバルAIマーケティング<br>ニュースコレクター</h1>
  <p>世界6地域のAIマーケティング最新動向を<br>ワンクリックで自動収集（無料・APIキー不要）</p>
  <button class="btn-main" id="collectBtn" onclick="startCollection()">⚡ 最新情報を収集</button>
  <div class="region-tags" id="regionTags"></div>
</div>
<div class="container">
  <div id="loaderArea"></div>
  <div id="errorArea"></div>
  <div id="summaryArea"></div>
  <div id="filterArea"></div>
  <div id="newsArea"></div>
  <div id="emptyArea">
    <div class="empty"><div class="icon">🛰️</div><div>ボタンを押して世界中のAIマーケティング情報を収集しましょう</div></div>
  </div>
</div>
<script>
const REGIONS = [
  { id:"us",  label:"🇺🇸 北米",       query:"アメリカ AI マーケティング 戦略 トレンド",     color:"#FF6B35" },
  { id:"eu",  label:"🇪🇺 欧州",       query:"ヨーロッパ AI マーケティング 自動化 最新",     color:"#4ECDC4" },
  { id:"cn",  label:"🇨🇳 中国",       query:"中国 AI マーケティング テクノロジー 最新",     color:"#FF4058" },
  { id:"jp",  label:"🇯🇵 日本",       query:"日本 AI マーケティング 最新ニュース",          color:"#7B68EE" },
  { id:"sea", label:"🌏 東南アジア",   query:"東南アジア AI デジタルマーケティング 最新",    color:"#FFD93D" },
  { id:"in",  label:"🇮🇳 インド",     query:"インド AI マーケティング テクノロジー 最新",   color:"#6BCB77" },
];
let allNews = [];
let currentFilter = "all";

(function initTags() {
  const c = document.getElementById("regionTags");
  REGIONS.forEach(r => {
    const s = document.createElement("span");
    s.className = "region-tag";
    s.textContent = r.label;
    s.style.background = r.color + "15";
    s.style.color = r.color + "BB";
    s.style.borderColor = r.color + "22";
    c.appendChild(s);
  });
})();

// RSS to JSON proxy
const RSS_PROXY = "https://api.rss2json.com/v1/api.json?rss_url=";
// CORS proxy for fetching article content
const CORS_PROXY = "https://api.allorigins.win/raw?url=";

// Extract article body text from HTML
function extractArticleText(html) {
  const doc = new DOMParser().parseFromString(html, "text/html");
  // Remove scripts, styles, nav, header, footer, ads
  doc.querySelectorAll("script,style,nav,header,footer,aside,iframe,form,.ad,.ads,.advertisement,[role='navigation'],[role='banner']").forEach(el => el.remove());
  // Try to find article content
  const article = doc.querySelector("article") || doc.querySelector("[role='main']") || doc.querySelector("main") || doc.querySelector(".article-body") || doc.querySelector(".post-content") || doc.querySelector(".entry-content");
  const target = article || doc.body;
  if (!target) return "";
  // Get paragraphs
  const paragraphs = target.querySelectorAll("p");
  if (paragraphs.length > 0) {
    const texts = [];
    paragraphs.forEach(p => {
      const t = p.textContent.trim();
      if (t.length > 30) texts.push(t);
    });
    return texts.slice(0, 5).join(" ").slice(0, 500);
  }
  // Fallback: get all text
  return target.textContent.replace(/\s+/g, " ").trim().slice(0, 500);
}

// Fetch and extract article summary
async function fetchArticleSummary(link) {
  try {
    const res = await fetch(CORS_PROXY + encodeURIComponent(link), { signal: AbortSignal.timeout(8000) });
    if (!res.ok) return "";
    const html = await res.text();
    return extractArticleText(html);
  } catch {
    return "";
  }
}

async function fetchRegionRSS(region) {
  const rssUrl = `https://news.google.com/rss/search?q=${encodeURIComponent(region.query)}&hl=ja&gl=JP&ceid=JP:ja`;
  const url = RSS_PROXY + encodeURIComponent(rssUrl);
  const res = await fetch(url);
  if (!res.ok) throw new Error(`RSS fetch failed for ${region.label}`);
  const data = await res.json();
  if (data.status !== "ok" || !data.items) return [];
  const items = data.items.slice(0, 3);
  // Fetch article content in parallel
  const results = await Promise.all(items.map(async item => {
    const pubDate = item.pubDate ? new Date(item.pubDate) : null;
    const dateStr = pubDate
      ? `${pubDate.getFullYear()}/${(pubDate.getMonth()+1).toString().padStart(2,"0")}/${pubDate.getDate().toString().padStart(2,"0")}`
      : "";
    const link = item.link || "";
    let summary = "";
    if (link) {
      summary = await fetchArticleSummary(link);
    }
    if (!summary) {
      summary = item.description
        ? item.description.replace(/<[^>]*>/g, "").trim().slice(0, 200)
        : item.title;
    }
    return {
      title: item.title || "No title",
      summary,
      link,
      source: item.author || "",
      date: dateStr,
      regionId: region.id,
    };
  }));
  return results;
}

function showLoader(pct, label) {
  document.getElementById("loaderArea").innerHTML = `
    <div class="loader-wrap">
      <div class="orb" style="background:conic-gradient(var(--accent) ${pct}%, rgba(255,107,53,0.1) ${pct}%)">
        <div class="orb-inner">${Math.round(pct)}%</div>
      </div>
      <div style="text-align:center">
        <div class="loader-label">${label} の情報を収集中...</div>
        <div class="loader-sub">ニュース記事の本文を取得・要約しています</div>
      </div>
    </div>`;
}
function hideLoader() { document.getElementById("loaderArea").innerHTML = ""; }
function showError(msg) {
  document.getElementById("errorArea").innerHTML = `
    <div class="error-box">
      <div style="font-size:40px;margin-bottom:12px">⚠️</div>
      <div style="font-weight:700;margin-bottom:8px">エラーが発生しました</div>
      <div style="font-size:13px;color:var(--text-dim)">${msg}</div>
    </div>`;
}

function renderSummary() {
  const regionCounts = REGIONS.map(r => {
    const cnt = allNews.filter(n => n.regionId === r.id).length;
    return { ...r, count: cnt };
  }).filter(r => r.count > 0);
  document.getElementById("summaryArea").innerHTML = `
    <div class="summary-box">
      <div class="label">📊 収集結果サマリー</div>
      <div class="body">合計 ${allNews.length} 件のAIマーケティング関連ニュースを ${regionCounts.length} 地域から収集しました。</div>
      <div class="stat-row">
        ${regionCounts.map(r => `<span class="stat" style="background:${r.color}18;color:${r.color}">${r.label} ${r.count}件</span>`).join("")}
      </div>
    </div>`;
}

function renderFilters() {
  const c = document.getElementById("filterArea");
  let html = `<div class="filters">`;
  html += `<button class="filter-btn ${currentFilter==='all'?'active':''}" onclick="applyFilter('all')">すべて (${allNews.length})</button>`;
  REGIONS.forEach(r => {
    const cnt = allNews.filter(n => n.regionId === r.id).length;
    if (!cnt) return;
    const act = currentFilter === r.id;
    html += `<button class="filter-btn" onclick="applyFilter('${r.id}')"
      style="background:${act ? r.color+'22':'var(--card)'};color:${act ? r.color:'var(--text-dim)'};border-color:${act ? r.color+'44':'var(--border)'}"
    >${r.label} (${cnt})</button>`;
  });
  html += `</div>`;
  c.innerHTML = html;
}

function renderNews() {
  const list = currentFilter === "all" ? allNews : allNews.filter(n => n.regionId === currentFilter);
  const c = document.getElementById("newsArea");
  if (!list.length) {
    c.innerHTML = `<div style="text-align:center;padding:40px;color:var(--text-dim);font-size:14px">この地域のニュースはありません</div>`;
    return;
  }
  c.innerHTML = list.map((item, i) => {
    const r = REGIONS.find(x => x.id === item.regionId) || REGIONS[0];
    const hasLongText = item.summary && item.summary.length > 120;
    return `
    <div class="card" style="animation:fadeUp .5s ease ${i*0.06}s both">
      <div class="stripe" style="background:${r.color}"></div>
      <div class="meta">
        <span class="badge" style="background:${r.color}22;color:${r.color}">${r.label}</span>
        ${item.source ? `<span class="cat">${item.source}</span>` : ''}
        ${item.date ? `<span class="date">${item.date}</span>` : ''}
      </div>
      <h3><a href="${item.link}" target="_blank" rel="noopener">${item.title}</a></h3>
      <p class="desc">${item.summary}</p>
      ${hasLongText ? `<div class="toggle" onclick="toggleCard(this)">▼ もっと読む</div>` : ''}
      ${item.link ? `<a class="source-link" href="${item.link}" target="_blank" rel="noopener">📰 元記事を読む →</a>` : ''}
    </div>`;
  }).join("");
}

function toggleCard(el) {
  const card = el.closest(".card");
  const desc = card.querySelector(".desc");
  const open = desc.classList.toggle("open");
  el.textContent = open ? "▲ 閉じる" : "▼ もっと読む";
}

function applyFilter(id) {
  currentFilter = id;
  renderFilters();
  renderNews();
}

async function startCollection() {
  const btn = document.getElementById("collectBtn");
  btn.disabled = true; btn.textContent = "収集中..."; btn.style.animation = "none";
  document.getElementById("emptyArea").innerHTML = "";
  document.getElementById("errorArea").innerHTML = "";
  document.getElementById("summaryArea").innerHTML = "";
  document.getElementById("filterArea").innerHTML = "";
  document.getElementById("newsArea").innerHTML = "";
  allNews = [];
  currentFilter = "all";
  try {
    for (let i = 0; i < REGIONS.length; i++) {
      showLoader((i / REGIONS.length) * 100, REGIONS[i].label);
      const items = await fetchRegionRSS(REGIONS[i]);
      allNews.push(...items);
      renderFilters();
      renderNews();
    }
    hideLoader();
    renderSummary();
    renderFilters();
    renderNews();
  } catch (e) {
    hideLoader();
    showError(e.message || "不明なエラー。しばらくしてから再度お試しください。");
  }
  btn.disabled = false; btn.textContent = "🔄 再収集する";
}
</script>
</body>
</html>
